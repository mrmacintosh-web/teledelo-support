<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Support inbox | TeleDelo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/help/assets/portal.css"><link rel="stylesheet" href="/help/assets/support-ui.css"><script src="/help/admin/admin.js" defer></script></head><body class="support-ui">
<header class="top"><div class="top-brand"><a class="brand" href="/help">TeleDelo</a><span>Support inbox</span></div><a class="top-link" href="/help" aria-label="Help Center"><span class="link-long">Help Center</span><span class="link-short">Help</span><span aria-hidden="true">↗</span></a></header>
<main class="container"><div class="toolbar portal-hero"><div><span class="eyebrow">TeleDelo support / Team workspace</span><h1>Support inbox</h1><p class="muted" id="staffInfo">Staff only</p></div><div class="filters"><label for="filter">Show</label><select id="filter"><option value="all">All tickets</option><option value="open">Open</option><option value="in_progress">In progress</option><option value="waiting_customer">Waiting for customer</option><option value="resolved">Resolved</option></select><button class="btn secondary small" id="refresh">Refresh</button></div></div><div id="staffNote" class="notice" hidden></div>
<div class="split"><div class="panel"><h2>Requests</h2><div id="tickets" class="ticketlist"><p class="muted">Loading…</p></div></div><section class="panel" id="detail" aria-label="Selected support ticket"><h2 id="ticketTitle">Select a request</h2><p class="muted" id="emptyDetail">Choose a ticket to view its messages and reply.</p><div id="detailBody" hidden><div class="info" id="ticketInfo"></div><div class="fields" style="margin-top:16px"><div class="field"><label for="status">Status</label><select id="status"><option value="open">Open</option><option value="in_progress">In progress</option><option value="waiting_customer">Waiting for customer</option><option value="resolved">Resolved</option></select></div><div class="field"><label for="assign">Assigned to</label><select id="assign"><option value="">Unassigned</option></select></div><button class="btn secondary" id="saveStatus" type="button">Save changes</button></div><hr style="border:0;border-top:1px solid #e8ebed;margin:24px 0"><h2>Conversation</h2><div class="conversation" id="conversation"></div><form class="fields messagebox" id="staffReplyForm"><div class="field"><label for="staffMessage">Reply or internal note</label><textarea required maxlength="3000" id="staffMessage" placeholder="Write a reply to the customer."></textarea></div><div class="spaced"><label><input type="checkbox" id="internal"> Internal note (not visible to customer)</label></div><button class="btn" id="sendReply" type="submit">Send reply</button></form></div></section></div><div class="footer"><span class="footer-brand">TeleDelo</span><span>· Your phone, answered.</span></div></main></body></html>
